  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Slab:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fdf2f6;
      --surface: #fffbfc;
      --ink: #3b1228;
      --muted: #7a4a62;
      --accent: #9f1239;
      --accent-hover: #881337;
      --accent-soft: #fce7f3;
      --border: #f0b8cc;
      --sakura: #f9a8d4;
      --sakura-deep: #ec4899;
      --burgundy: #701a3a;
      --heal: #10b981;
      --heal-glow: rgba(16, 185, 129, 0.55);
      --byakugou: #4ade80;
      --shadow: 0 12px 40px rgba(59, 18, 40, 0.12);
      --radius: 14px;
      --max: 1080px;
      --font-body: "Roboto", system-ui, sans-serif;
      --font-heading: "Roboto Slab", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--ink);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(249, 168, 212, 0.35), transparent),
        linear-gradient(rgba(159, 18, 57, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(159, 18, 57, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
    }

    a {
      color: var(--accent-hover);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover {
      color: var(--accent);
      text-decoration-thickness: 2px;
    }

    .wrap {
      width: min(100% - 2rem, var(--max));
      margin-inline: auto;
    }

    .lang-bar {
      display: flex;
      justify-content: flex-end;
      padding: 1rem 1rem 0;
    }

    .lang-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(59, 18, 40, 0.08);
    }

    .lang-toggle button {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 0.85rem;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .lang-toggle button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--surface);
    }

    .lang-toggle button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .hero { padding: 1.25rem 0 2.5rem; }

    .hero-inner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 600;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 1.15rem;
      color: var(--accent);
      font-weight: 600;
      margin: 0 0 1.25rem;
    }

    .bio {
      max-width: 62ch;
      color: var(--muted);
      margin: 0 0 1rem;
    }

    .portfolio-intro {
      max-width: 62ch;
      margin: 0 0 1.75rem;
      padding: 0.85rem 1rem;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: var(--ink);
      font-size: 0.98rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: border-color 0.15s, background 0.15s;
    }

    .links a:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      margin: 0 0 1.25rem;
      font-weight: 600;
    }

    .projects { padding-bottom: 2rem; }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 1.25rem;
    }

    .project-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(59, 18, 40, 0.07);
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      isolation: isolate;
    }

    .project-card:hover,
    .project-card:focus-visible {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: var(--sakura-deep);
    }

    .project-card--soon {
      opacity: 0.95;
    }

    .project-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .card-fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      border-radius: inherit;
    }

    /* Sakura effects: decorative layers never intercept card links. */
    .card-fx { overflow: hidden; }
    .project-card-body, .project-thumb { position: relative; z-index: 2; }

    /* 1. Petals travel across the CARD, not a percentage of their own size. */
    .petal {
      position: absolute; top: -12%; left: var(--left);
      width: var(--size, 13px); height: calc(var(--size, 13px) * 1.35);
      background: linear-gradient(145deg, #fff4f8 5%, #f9a8c7 55%, #df528b);
      border-radius: 75% 15% 70% 30%; opacity: 0;
      clip-path: polygon(45% 0, 56% 10%, 70% 3%, 92% 24%, 100% 49%, 83% 78%, 20% 100%, 0 62%, 7% 27%);
      filter: drop-shadow(0 2px 2px #9f123933);
    }
    .project-card--petals:is(:hover, :focus-visible) .petal {
      animation: sakura-flight var(--dur, 3.4s) linear infinite;
      animation-delay: var(--delay, 0s);
    }
    @keyframes sakura-flight {
      0% { top: -12%; opacity: 0; transform: translateX(-25px) rotate(var(--rot)); }
      12% { opacity: .9; }
      36% { transform: translateX(32px) rotate(calc(var(--rot) + 110deg)) rotateY(40deg); }
      68% { opacity: .8; transform: translateX(-8px) rotate(calc(var(--rot) + 230deg)) rotateY(-35deg); }
      100% { top: 110%; opacity: 0; transform: translateX(70px) rotate(calc(var(--rot) + 360deg)); }
    }

    /* 2. Violet diamond releases branching, black ink markings. */
    .byakugou-wrap { position: absolute; inset: 0; opacity: 0; transition: opacity .28s; }
    .byakugou-seal { display: block; width: 100%; height: 100%; }
    .seal-core { fill: #8b3bb0; stroke: #482050; stroke-width: 1.5; transform-origin: 160px 29px; transform: scale(.3); transition: transform .4s ease; }
    .seal-lines { fill: none; stroke: #20131f; stroke-width: 3.2; stroke-linejoin: round; stroke-linecap: round; }
    .seal-lines path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .85s cubic-bezier(.25,.65,.3,1); }
    .seal-lines .branch { stroke-width: 2; transition-delay: .18s; }
    .project-card--byakugou:is(:hover, :focus-visible) .byakugou-wrap { opacity: .9; }
    .project-card--byakugou:is(:hover, :focus-visible) .seal-core { transform: scale(1); }
    .project-card--byakugou:is(:hover, :focus-visible) .seal-lines path { stroke-dashoffset: 0; }
    .project-card--byakugou:is(:hover, :focus-visible) { border-color: #452039; box-shadow: var(--shadow), 0 0 22px #7e22ce16; }

    /* 3. Emerald edge glow, moving chakra wisps and rising light motes. */
    .healing-aura { position: absolute; inset: 0; opacity: 0; transition: opacity .4s;
      background: radial-gradient(ellipse at 50% 23%, #6ee7b73d, transparent 60%);
      box-shadow: inset 0 0 28px #10b98155, inset 0 0 8px #34d39988; }
    .healing-aura::before, .healing-aura::after { content: ''; position: absolute; inset: -35%;
      background: conic-gradient(from 0deg, transparent 0 20%, #10b98155 27%, transparent 35% 65%, #6ee7b766 73%, transparent 82%);
      filter: blur(22px); opacity: .6;
      mask-image: radial-gradient(ellipse, transparent 32%, #000 57%); }
    .healing-aura::after { transform: rotate(110deg); }
    .chakra-mote { position: absolute; bottom: -5%; left: var(--left); width: 4px; height: 7px; border-radius: 50%;
      background: #b5ffe3; box-shadow: 0 0 7px 3px #10b98188; opacity: 0; }
    .project-card--healing:is(:hover, :focus-visible) .healing-aura { opacity: 1; animation: chakra-breathe 2.6s ease-in-out infinite; }
    .project-card--healing:is(:hover, :focus-visible) .healing-aura::before { animation: chakra-swirl 7s linear infinite; }
    .project-card--healing:is(:hover, :focus-visible) .healing-aura::after { animation: chakra-swirl 9s linear infinite reverse; }
    .project-card--healing:is(:hover, :focus-visible) .chakra-mote { animation: chakra-rise var(--dur, 3s) ease-out infinite; animation-delay: var(--delay, 0s); }
    .project-card--healing:is(:hover, :focus-visible) { border-color: #059669; box-shadow: var(--shadow), 0 0 22px #10b98166, 0 0 48px #10b98122; }
    @keyframes chakra-breathe { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
    @keyframes chakra-swirl { to { transform: rotate(360deg); } }
    @keyframes chakra-rise {
      0% { bottom: -5%; opacity: 0; transform: translateX(0) scale(.6); }
      20% { opacity: .85; } 75% { opacity: .5; }
      100% { bottom: 105%; opacity: 0; transform: translateX(var(--drift, 15px)) scale(.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .project-card, .project-card * { transition: none !important; }
      .project-card:is(:hover, :focus-visible) { transform: none; }
      .card-fx *, .card-fx *::before, .card-fx *::after { animation: none !important; }
      .project-card--petals:is(:hover, :focus-visible) .petal { top: var(--rest); opacity: .65; transform: rotate(var(--rot)); }
    }

    .project-thumb {
      position: relative;
      z-index: 2;
    }

    @media (prefers-reduced-motion: reduce) {
      .project-card--petals .petal,
      .project-card--byakugou .byakugou-wrap,
      .project-card--healing .healing-aura {
        animation: none !important;
      }

      .project-card--petals:hover .petal,
      .project-card--petals:focus-visible .petal {
        opacity: 0.7;
        transform: translateY(20%) rotate(var(--rot, 40deg));
      }

      .project-card--byakugou:hover .byakugou-wrap,
      .project-card--byakugou:focus-visible .byakugou-wrap {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1);
      }

      .project-card--healing:hover .healing-aura,
      .project-card--healing:focus-visible .healing-aura {
        opacity: 0.75;
      }
    }

    .project-thumb {
      aspect-ratio: 16 / 10;
      background: linear-gradient(135deg, var(--accent-soft), #fbcfe8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .project-thumb--soon {
      background: linear-gradient(135deg, #fce7f3, #fdf2f8);
    }

    .project-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-card-body {
      padding: 1.15rem 1.25rem 1.35rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .project-card h2 {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      margin: 0 0 0.5rem;
      font-weight: 600;
    }

    .project-card p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
      flex: 1;
    }

    .project-card .cta {
      margin-top: 0.85rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }

    .project-card--soon .cta { color: var(--muted); }

    .detail {
      padding: 3rem 0 4rem;
      scroll-margin-top: 1.5rem;
    }

    .detail + .detail { border-top: 1px solid var(--border); }

    .detail-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem 1rem;
      margin-bottom: 1.5rem;
    }

    .detail-header h2 {
      font-family: var(--font-heading);
      font-size: clamp(1.5rem, 3vw, 1.85rem);
      margin: 0;
      font-weight: 600;
    }

    .detail-header .badge {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .detail-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
    }

    .detail-block h3 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin: 0 0 0.5rem;
      font-weight: 700;
    }

    .detail-block p,
    .detail-block ul,
    .detail-block ol {
      margin: 0;
      color: var(--ink);
    }

    .detail-block ul,
    .detail-block ol { padding-left: 1.25rem; }

    .detail-block li + li { margin-top: 0.35rem; }

    .screenshots {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .screenshot-placeholder {
      aspect-ratio: 4 / 3;
      border-radius: 8px;
      border: 1px dashed var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      padding: 0.5rem;
    }

    .code-box {
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 0.88rem;
      background: var(--ink);
      color: #fce7f3;
      padding: 1rem 1.1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin-top: 0.75rem;
      white-space: pre-wrap;
    }

    .back-top {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem 3rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>

    const LANG_KEY = "portfolio-lang";

    function applyLang(lang) {
      const strings = I18N[lang] || I18N.es;
      document.documentElement.lang = lang;

      document.getElementById("doc-title").textContent = strings["doc-title"];
      document.getElementById("meta-desc").setAttribute("content", strings["meta-desc"]);

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (strings[key] != null) el.textContent = strings[key];
      });

      document.querySelectorAll("[data-i18n-html]").forEach((el) => {
        const key = el.getAttribute("data-i18n-html");
        if (strings[key] != null) el.innerHTML = strings[key];
      });

      document.querySelectorAll("[data-i18n-attr]").forEach((el) => {
        const spec = el.getAttribute("data-i18n-attr");
        spec.split(";").forEach((pair) => {
          const [key, attr] = pair.split(":").map((s) => s.trim());
          if (strings[key] != null && attr) el.setAttribute(attr, strings[key]);
        });
      });

      document.getElementById("btn-es").setAttribute("aria-pressed", lang === "es");
      document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");

      try {
        localStorage.setItem(LANG_KEY, lang);
      } catch (_) {}
    }

    function initLang() {
      let lang = "es";
      try {
        const saved = localStorage.getItem(LANG_KEY);
        if (saved === "en" || saved === "es") lang = saved;
      } catch (_) {}
      applyLang(lang);

      document.querySelectorAll(".lang-toggle button").forEach((btn) => {
        btn.addEventListener("click", () => applyLang(btn.getAttribute("data-lang")));
      });
    }

    document.getElementById("year").textContent = new Date().getFullYear();
