<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Slab:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f0d4;
      --surface: #fffef6;
      --ink: #2a2416;
      --muted: #6d6249;
      --accent: #a16207;
      --accent-hover: #854d0e;
      --accent-soft: #fef3c7;
      --border: #e6d9a8;
      --shadow: 0 12px 40px rgba(42, 36, 22, 0.1);
      --radius: 14px;
      --max: 1080px;
      --font-body: "Roboto", system-ui, sans-serif;
      --font-heading: "Roboto Slab", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--ink);
      background: var(--bg);
      background-image:
        linear-gradient(rgba(42, 36, 22, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(42, 36, 22, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    a {
      color: var(--accent-hover);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover {
      color: var(--accent);
      text-decoration-thickness: 2px;
    }

    .wrap {
      width: min(100% - 2rem, var(--max));
      margin-inline: auto;
    }

    .lang-bar {
      display: flex;
      justify-content: flex-end;
      padding: 1rem 1rem 0;
    }

    .lang-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(42, 36, 22, 0.08);
    }

    .lang-toggle button {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 0.85rem;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .lang-toggle button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--surface);
    }

    .lang-toggle button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .hero { padding: 1.25rem 0 2.5rem; }

    .hero-inner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 600;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 1.15rem;
      color: var(--accent);
      font-weight: 600;
      margin: 0 0 1.25rem;
    }

    .bio {
      max-width: 62ch;
      color: var(--muted);
      margin: 0 0 1rem;
    }

    .portfolio-intro {
      max-width: 62ch;
      margin: 0 0 1.75rem;
      padding: 0.85rem 1rem;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: var(--ink);
      font-size: 0.98rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: border-color 0.15s, background 0.15s;
    }

    .links a:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      margin: 0 0 1.25rem;
      font-weight: 600;
    }

    .projects { padding-bottom: 2rem; }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 1.25rem;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(42, 36, 22, 0.06);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .project-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: var(--accent);
    }

    .project-card--muted {
      opacity: 0.92;
    }

    .project-card--muted:hover {
      border-color: var(--border);
      transform: none;
      box-shadow: 0 4px 20px rgba(42, 36, 22, 0.06);
    }

    .project-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .project-thumb {
      aspect-ratio: 16 / 10;
      background: linear-gradient(135deg, var(--accent-soft), #f5e6b8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .project-thumb--soon {
      background: linear-gradient(135deg, #ede4c4, #f7f0d4);
    }

    .project-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-card-body {
      padding: 1.15rem 1.25rem 1.35rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .project-card h2 {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      margin: 0 0 0.5rem;
      font-weight: 600;
    }

    .project-card p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
      flex: 1;
    }

    .project-card .cta {
      margin-top: 0.85rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }

    .project-card--muted .cta { color: var(--muted); }

    .detail {
      padding: 3rem 0 4rem;
      scroll-margin-top: 1.5rem;
    }

    .detail + .detail { border-top: 1px solid var(--border); }

    .detail-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem 1rem;
      margin-bottom: 1.5rem;
    }

    .detail-header h2 {
      font-family: var(--font-heading);
      font-size: clamp(1.5rem, 3vw, 1.85rem);
      margin: 0;
      font-weight: 600;
    }

    .detail-header .badge {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .detail-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
    }

    .detail-block h3 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin: 0 0 0.5rem;
      font-weight: 700;
    }

    .detail-block p,
    .detail-block ul,
    .detail-block ol {
      margin: 0;
      color: var(--ink);
    }

    .detail-block ul,
    .detail-block ol { padding-left: 1.25rem; }

    .detail-block li + li { margin-top: 0.35rem; }

    .screenshots {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .screenshot-placeholder {
      aspect-ratio: 4 / 3;
      border-radius: 8px;
      border: 1px dashed var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      padding: 0.5rem;
    }

    .code-box {
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 0.88rem;
      background: var(--ink);
      color: #f5efd8;
      padding: 1rem 1.1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin-top: 0.75rem;
      white-space: pre-wrap;
    }

    .back-top {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem 3rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>

      document.getElementById("meta-desc").setAttribute("content", strings["meta-desc"]);

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (strings[key] != null) el.textContent = strings[key];
      });

      document.querySelectorAll("[data-i18n-html]").forEach((el) => {
        const key = el.getAttribute("data-i18n-html");
        if (strings[key] != null) el.innerHTML = strings[key];
      });

      document.querySelectorAll("[data-i18n-attr]").forEach((el) => {
        const spec = el.getAttribute("data-i18n-attr");
        spec.split(";").forEach((pair) => {
          const [key, attr] = pair.split(":").map((s) => s.trim());
          if (strings[key] != null && attr) el.setAttribute(attr, strings[key]);
        });
      });

      document.getElementById("btn-es").setAttribute("aria-pressed", lang === "es");
      document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");

      try {
        localStorage.setItem(LANG_KEY, lang);
      } catch (_) {}
    }

    function initLang() {
      let lang = "es";
      try {
        const saved = localStorage.getItem(LANG_KEY);
        if (saved === "en" || saved === "es") lang = saved;
      } catch (_) {}
      applyLang(lang);

      document.querySelectorAll(".lang-toggle button").forEach((btn) => {
        btn.addEventListener("click", () => applyLang(btn.getAttribute("data-lang")));
      });
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    initLang();
  </script>
</body>
</html>
